[package]
name = "glance"
description = "A small, fast Linux utility that groups running processes by application"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
glance-proc.workspace = true
glance-group.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gdk4 = { version = "0.11" }
gio = { version = "0.22" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
async-channel = "2.5"
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mimalloc = { version = "0.1.52", default-features = false }
libc = "0.2.190"
