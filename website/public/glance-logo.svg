       L245 198
       Q251 203 245 208
       L205 240"
    fill="none"
    stroke="#000000"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- G -->
  <path
    fill="#000000"
