<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Terminal G logo</title>
  <desc id="desc">Minimal terminal icon with greater-than prompt and G above underscore. Transparent background.</desc>

  <!-- Outer terminal/key shape -->
  <path
    d="M106 135
       L151 90
       Q160 81 176 81
       H356
       Q374 81 378 99
       L395 298
       Q397 311 388 320
       L342 366
       Q333 375 320 375
       H137
       Q118 375 115 356
       L89 165
       Q87 148 98 139
       Z"
    fill="#000000"/>

  <!-- Screen -->
  <path
    d="M170 106
       H344
       Q357 106 359 119
       L374 286
       Q376 301 361 301
       H184
       Q171 301 169 288
       L154 123
       Q152 106 170 106
       Z"
    fill="#FFFFFF"/>

