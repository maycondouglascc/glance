       V209
       H331
       V218
       C326 222 320 224 313 224
       C296 224 284 212 284 195
       C284 178 296 166 312 166
       C323 166 332 170 339 177
       L350 165
       C339 155 326 150 312 150
       Z"/>

  <!-- Underscore cursor -->
  <rect x="285" y="253" width="69" height="18" rx="9" fill="#000000"/>
</svg>
